services:
  postgres:
    image: postgres:16
    container_name: paypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paypilot
      POSTGRES_USER: paypilot
      POSTGRES_PASSWORD: change-this-local-password
    ports:
      - "5432:5432"
    volumes:
      - paypilot_pgdata:/var/lib/postgresql/data
volumes:
  paypilot_pgdata:
